# WHY Comments Check — CI/CD Pipeline
#
# Chay kiem tra // WHY: va # WHY: comments moi khi push/PR.
# Dam bao moi function/useCallback trong codebase deu co comment
# giai thich design decisions.
#
# Trigger: push to main, pull requests
# Command: python scripts/check-why-comments.py --exit-error

name: WHY Comments Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  why-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run WHY comment check
        run: python scripts/check-why-comments.py --exit-error --verbose
