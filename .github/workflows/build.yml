# WHY: Build đa nền tảng — Windows x64 + macOS (một bản universal2 chạy được cả Intel
# lẫn Apple Silicon). Mỗi OS phải build trên chính runner của nó (Tauri/Apple không
# hỗ trợ cross-compile). Backend Python được đóng gói bằng PyInstaller RIÊNG cho từng
# OS rồi nhúng vào binary Tauri (src-tauri/backend-embed/) → app khép kín 1 file,
# không cần cài Python trên máy người dùng.
#
# ⚠️ GHÉP MAC INTEL + SILICON VÀO 1 BẢN:
#   GitHub ĐÃ GỠ runner Intel (macos-13, cuối 2025) → không còn cách nào build riêng
#   bản x86_64 trên runner GitHub. Giải pháp: 1 job macOS trên macos-14 (arm64) build
#   backend 2 LẦN — một bản arm64 (native) + một bản x86_64 (chạy qua Rosetta 2) — rồi
#   `lipo -create` gộp thành 1 fat binary chạy được trên cả 2 loại Mac. Rust/Tauri thì
#   build target universal-apple-darwin (cơ chế sẵn có). KHÔNG dùng `--target-arch
#   universal2` của PyInstaller vì nó đòi MỌI .so đều là fat binary — mà hầu hết wheel
#   C-extension (markupsafe, psutil, flask…) chỉ có bản x86_64 / arm64 RIÊNG → luôn fail.
#
# ⚠️ HẠN CHẾ BẢN MAC (đã cố tình chọn):
#   - psycopg2-binary (PostgreSQL) và mysql-connector-python (MySQL) đều có C extension
#     và KHÔNG có wheel universal2 → cả 2 bị bỏ khỏi requirements-mac.txt → tab Cơ sở
#     dữ liệu trên Mac sẽ báo lỗi driver khi kết nối (giao diện vẫn chạy).
#   - Tab Âm thanh / Máy in / Tunnel đã bị ẩn trên Mac ở frontend (Windows-only).
#
# ⚠️ AUTO-UPDATE (đã triển khai đầy đủ ở workflow này):
#   - Nếu repo có 2 secrets TAURI_SIGNING_PRIVATE_KEY + TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#     (nội dung file .key sinh bởi `npx tauri signer generate`), bước Build Tauri sẽ
#     bật createUpdaterArtifacts → Tauri tự ký installer → sinh file .sig bên cạnh
#     installer. Job release tạo latest.json (bản tin auto-update) đẩy lên GitHub
#     Release → app đã cài sẽ tự nhận bản mới qua endpoint trong tauri.conf.json.
#   - Không có secrets → build vẫn thành công (installer unsigned), chỉ thiếu auto-update.
#
# Trigger:
#   - push main         -> build + upload artifact (kiểm tra pipeline)
#   - push tag v*       -> build + tạo GitHub Release (draft) kèm installer + latest.json
#   - workflow_dispatch -> chạy tay từ GitHub UI

name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            backend_bin: backend.exe
            reqs: backend/requirements.txt
            rust_targets: ''
            tauri_args: ''
          - name: macOS Universal (Intel + Silicon)
            os: macos-14          # arm64 — build backend 2 arch + lipo cho cả 2 loại Mac
            backend_bin: backend
            reqs: backend/requirements-mac.txt
            rust_targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
            tauri_args: '--target universal-apple-darwin'

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # WHY: Windows dùng Python từ setup-python; macOS cần Python UNIVERSAL2 từ
      # python.org (bản pkg chạy được cả 2 arch — arm64 native lẫn x86_64 qua Rosetta)
      # để mỗi venv build được đúng arch của nó.
      - name: Setup Python (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install universal2 Python (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -sSL -o /tmp/python.pkg \
            "https://www.python.org/ftp/python/3.12.10/python-3.12.10-macos11.pkg"
          sudo installer -pkg /tmp/python.pkg -target /
          /Library/Frameworks/Python.framework/Versions/3.12/bin/python3 --version

      # WHY: Build backend x86_64 trên runner arm64 cần Rosetta 2 (chạy binary Intel
      # trên chip Apple Silicon). Runner GitHub đã cài sẵn; lệnh này chỉ đảm bảo chắc
      # chắn có (idempotent, nhanh nếu đã cài).
      - name: Ensure Rosetta 2 (macOS)
        if: runner.os == 'macOS'
        run: |
          sudo softwareupdate --install-rosetta --agree-to-license || true
          arch -x86_64 /usr/bin/true && echo "Rosetta x86_64 OK"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install frontend dependencies
        run: npm ci

      # WHY: dist/ (SPA) cần tồn tại TRƯỚC PyInstaller vì được nhúng vào backend
      # (--add-data) để backend phục vụ được giao diện.
      - name: Build frontend (dist)
        run: npm run build

      # WHY: Cài deps backend. Windows: 1 venv (setup-python) là đủ. macOS: phải tạo
      # 2 venv RIÊNG từ Python universal2 — venv arm64 (native) và venv x86_64 (qua
      # Rosetta) — vì pip tải wheel theo arch của trình thông dịch; không thể dùng chung
      # 1 venv cho cả 2 arch (markupsafe/psutil… không có wheel universal2).
      - name: Install Python dependencies
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            PY="/Library/Frameworks/Python.framework/Versions/3.12/bin/python3"
            "$PY" -m venv backend/venv-arm
            "$PY" -m venv backend/venv-x86 --without-pip || true
            arch -x86_64 "$PY" -m venv backend/venv-x86 --upgrade-deps 2>/dev/null || arch -x86_64 "$PY" -m venv backend/venv-x86
            backend/venv-arm/bin/python -m pip install --upgrade pip
            backend/venv-arm/bin/python -m pip install -r ${{ matrix.reqs }}
            arch -x86_64 backend/venv-x86/bin/python -m pip install --upgrade pip
            arch -x86_64 backend/venv-x86/bin/python -m pip install -r ${{ matrix.reqs }}
          else
            python -m pip install --upgrade pip
            python -m pip install -r ${{ matrix.reqs }}
          fi

      # WHY: Đóng gói backend thành 1 binary tự chứa (Flask + mọi dep + dist/).
      # Windows: 1 lần với pycaw/comtypes/win32print (tab Âm thanh/Máy in).
      # macOS: build 2 lần (arm64 native + x86_64 qua Rosetta) rồi lipo gộp fat binary
      # — KHÔNG dùng --target-arch universal2 vì đòi mọi .so fat (xem comment đầu file).
      # Không kéo pycaw/win32print (requirements-mac.txt) vì tab Âm thanh/Máy in ẩn trên Mac.
      - name: Build backend with PyInstaller
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            # arm64 build (native)
            backend/venv-arm/bin/python -m PyInstaller --noconfirm --clean --onefile --windowed --name backend-arm \
              --distpath backend/py-dist --workpath backend/py-build-arm \
              --add-data "dist:dist" --target-arch arm64 \
              backend/app.py
            # x86_64 build (qua Rosetta)
            arch -x86_64 backend/venv-x86/bin/python -m PyInstaller --noconfirm --clean --onefile --windowed --name backend-x86 \
              --distpath backend/py-dist-x86 --workpath backend/py-build-x86 \
              --add-data "dist:dist" --target-arch x86_64 \
              backend/app.py
            # Gộp 2 binary thành 1 fat binary tên 'backend'
            lipo -create backend/py-dist/backend-arm backend/py-dist-x86/backend-x86 -output backend/py-dist/backend
            lipo -info backend/py-dist/backend
            file backend/py-dist/backend
          else
            python -m PyInstaller --noconfirm --clean --onefile --windowed --name backend \
              --distpath backend/py-dist --workpath backend/py-build \
              --add-data "dist;dist" \
              --collect-all pycaw --collect-all comtypes --hidden-import win32print --hidden-import win32com.client --hidden-import win32event --hidden-import pythoncom \
              --hidden-import psycopg2 --hidden-import mysql.connector \
              backend/app.py
          fi

      # WHY: Copy backend thật vào src-tauri/backend-embed/ — build.rs/include_bytes!
      # cần nó TRƯỚC khi cargo compile để nhúng vào binary Tauri.
      - name: Embed backend into Tauri source
        shell: bash
        run: |
          mkdir -p src-tauri/backend-embed
          cp "backend/py-dist/${{ matrix.backend_bin }}" "src-tauri/backend-embed/${{ matrix.backend_bin }}"
          file "src-tauri/backend-embed/${{ matrix.backend_bin }}" 2>/dev/null || ls -la src-tauri/backend-embed/

      # WHY: Tauri build ra bundle theo OS: Windows = .msi + .exe (NSIS), macOS
      # universal2 = .app + .dmg. Nếu có signing secrets (TAURI_SIGNING_PRIVATE_KEY)
      # → bật createUpdaterArtifacts để Tauri tự ký installer và sinh .sig (cần cho
      # auto-update). Không có key → build unsigned bình thường (auto-update tắt).
      # Lưu ý: createUpdaterArtifacts mặc định là false trong tauri.conf.json (để build
      # local không đòi key) nên phải override qua --config khi CI có secret.
      - name: Build Tauri app (bundles)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "Signing key present — enabling updater artifacts (.sig)"
            npx tauri build ${{ matrix.tauri_args }} --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            echo "No signing key — unsigned installers only (no auto-update)"
            npx tauri build ${{ matrix.tauri_args }}
          fi

      # WHY: Upload artifacts. Windows build ra ở target/release/, macOS universal ra ở
      # target/universal-apple-darwin/release/ — include CẢ 2 (glob nào không khớp sẽ
      # bỏ qua, miễn có ít nhất 1 file khớp là không lỗi).
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/multitool-pro*
            src-tauri/target/universal-apple-darwin/release/multitool-pro*
            src-tauri/target/release/bundle/**
            src-tauri/target/universal-apple-darwin/release/bundle/**

  # WHY: Khi push tag v* → gộp bundle của cả 2 nền tảng vào 1 GitHub Release (draft).
  # Các file .sig (khi có signing) cũng được đẩy lên để tauri-plugin-updater xác minh.
  # Draft để user kiểm tra rồi bấm Publish — tránh release vội bản hỏng.
  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all bundles
        uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true

      # WHY: Tạo Release DRAFT trước — latest.json ở bước sau cần biết tên asset đã
      # đăng (URL cố định theo tag), nên tạo release trước rồi mới sinh latest.json.
      - name: Create GitHub Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MultiTool Pro ${{ github.ref_name }}
          draft: true
          prerelease: false
          # WHY: Chỉ upload file NGƯỜI DÙNG cần: installer (msi/setup.exe), bản tải tay
          # (dmg/app.tar.gz) + signature. KHÔNG upload raw binaries (multitool-pro[.exe])
          # — thừa, gấp đôi dung lượng release, latest.json không trỏ vào chúng.
          files: |
            bundles/**/*.msi
            bundles/**/*.exe
            bundles/**/*.dmg
            bundles/**/*.app.tar.gz
            bundles/**/*.sig

      # WHY: Tạo latest.json cho tauri-plugin-updater — bản tin auto-update mà app gọi
      # qua endpoint trong tauri.conf.json. Chỉ tạo khi có file .sig (nghĩa là đã có
      # signing secrets). Mapping platform chuẩn Tauri v2:
      #   - windows-x86_64  -> NSIS `*-setup.exe` + signature `<name>.sig`
      #   - macOS (universal) -> updater bundle `*.app.tar.gz` + `<name>.sig`; gán cho
      #     cả darwin-x86_64 lẫn darwin-aarch64 vì bản universal chạy được cả 2 arch.
      #   (KHÔNG dùng .dmg — Tauri v2 dùng .app.tar.gz cho updater, .dmg chỉ là bản tải tay)
      - name: Generate updater latest.json
        shell: bash
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # WHY: Dùng find thay vì `ls bundles/**/*.sig` — bash mặc định KHÔNG bật
          # globstar nên `**` không khớp đệ quy → check sai (bỏ qua latest.json dù
          # .sig có tồn tại). find đệ quy độc lập với globstar.
          if ! find bundles -name '*.sig' -print -quit | grep -q .; then
            echo "⚠️ Không có file .sig — bỏ qua latest.json (cần TAURI_SIGNING_PRIVATE_KEY)."
            exit 0
          fi
          python3 - <<'EOF'
          import json, os, datetime, urllib.parse, urllib.request
          token = os.environ["GITHUB_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["GITHUB_REF_NAME"]
          ver = tag.lstrip("v")
          base = f"https://github.com/{repo}/releases/download/{tag}"

          def api(path):
              # WHY: Gọi GitHub API — tên asset THẬT sau khi upload có thể khác tên file
              # local (softprops/action-gh-release đổi space thành dấu chấm, vd
              # "MultiTool Pro_...setup.exe" → "MultiTool.Pro_...setup.exe"). Dùng API là
              # nguồn chân lý duy nhất để latest.json trỏ URL tải đúng, tránh 404.
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/{path}",
                  headers={"Authorization": f"Bearer {token}", "User-Agent": "multitool-pro-ci",
                           "Accept": "application/vnd.github+json"},
              )
              return json.load(urllib.request.urlopen(req))

          assets = api(f"releases/tags/{tag}/assets")
          by_name = {a["name"]: a for a in assets}

          def sig_of(name):
              # WHY: Đọc signature từ chính asset .sig đã upload (khớp tên thật), thay vì
              # file local — tránh lệch tên space/dấu chấm giữa 2 nguồn.
              a = by_name.get(name + ".sig")
              if not a:
                  return None
              req = urllib.request.Request(
                  a["url"],
                  headers={"Authorization": f"Bearer {token}", "Accept": "application/octet-stream"},
              )
              return urllib.request.urlopen(req).read().decode().strip()

          platforms = {}
          # Windows: NSIS setup.exe là target updater
          for name in by_name:
              if name.endswith("-setup.exe"):
                  sig = sig_of(name)
                  if sig:
                      platforms["windows-x86_64"] = {"signature": sig, "url": f"{base}/{urllib.parse.quote(name)}"}
          # macOS: updater bundle là .app.tar.gz (không phải .dmg); universal → cả 2 arch
          for name in by_name:
              if name.endswith(".app.tar.gz"):
                  sig = sig_of(name)
                  if sig:
                      entry = {"signature": sig, "url": f"{base}/{urllib.parse.quote(name)}"}
                      platforms["darwin-x86_64"] = entry
                      platforms["darwin-aarch64"] = entry
          manifest = {
              "version": ver,
              "notes": f"MultiTool Pro {ver}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00", "Z"),
              "platforms": platforms,
          }
          with open("latest.json", "w") as fh:
              json.dump(manifest, fh, indent=2)
          print(json.dumps(manifest, indent=2))
          EOF

      - name: Upload latest.json to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: latest.json
