[package]
name = "multitool-pro"
version = "1.11.7"
description = "MultiTool Pro - All-in-one utility"
authors = ["you"]
edition = "2021"

[lib]
name = "server_dashboard_lib"
crate-type = ["lib", "cdylib", "staticlib"]

# WHY: Tối ưu kích thước binary cho production build.
# LTO (fat) giúp trình biên dịch tối ưu xuyên module, giảm ~20-35% size.
# opt-level "z" tối ưu cho kích thước thay vì tốc độ (có thể chậm hơn 5-10%).
# strip = true loại bỏ debug symbols khỏi binary (~5-15MB).
# codegen-units = 1 tăng cơ hội tối ưu cho LLVM.
[profile.release]
lto = true
opt-level = "z"
strip = true
codegen-units = 1

[profile.release.package.tauri]
opt-level = 3

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# Plugin cập nhật tự động. Khi build, Tauri sẽ tạo file .sig đi kèm .msi/.exe.
# Người dùng cần:
#   1. Tạo keypair: npx tauri signer generate -w ~/.tauri/server-dashboard.key
#   2. Set biến môi trường TAURI_SIGNING_PRIVATE_KEY + TAURI_SIGNING_PRIVATE_KEY_PASSWORD khi build
#   3. Upload .msi, .msi.sig, .exe, .exe.sig lên GitHub Release
#   4. Tạo file latest.json mô tả phiên bản mới nhất (xem docs Tauri Updater)
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-positioner = { version = "2.0", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "blocking"] }
# WHY: Timestamp local cho header debug.log — SystemTime (UTC) lệch giờ với backend
# (datetime.now() local +7). chrono là transitive dep của tauri, thêm trực tiếp để dùng.
chrono = "0.4"
